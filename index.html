<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Solar System · three.js</title>
<style>
  :root {
    --glass: rgba(16, 20, 32, 0.55);
    --border: rgba(255, 255, 255, 0.12);
    --text: #e8ecf4;
    --muted: #9aa6bd;
    --accent: #6db4ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070f; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  /* Title / instructions */
  #title {
    position: fixed; top: 18px; left: 20px; z-index: 10;
    pointer-events: none; max-width: 340px;
  }
  #title h1 {
    margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .3px;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  #title p {
    margin: 6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }

  /* Bottom control bar */
  #controls {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #controls button {
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s, transform .05s;
  }
  #controls button:hover { background: rgba(255,255,255,.14); }
  #controls button:active { transform: scale(.96); }
  #controls button.active { background: var(--accent); color: #051221; border-color: var(--accent); font-weight: 600; }
  .ctl-group { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .ctl-group input[type=range] { width: 120px; accent-color: var(--accent); cursor: pointer; }
  .sep { width: 1px; height: 26px; background: var(--border); }

  /* Planet info panel */
  #info {
    position: fixed; top: 18px; right: 20px; z-index: 10; width: 290px;
    padding: 18px 20px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    transform: translateX(120%); opacity: 0; transition: transform .35s ease, opacity .35s ease;
  }
  #info.show { transform: translateX(0); opacity: 1; }
  #info .close {
    position: absolute; top: 12px; right: 14px; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1; border: none; background: none;
  }
  #info .close:hover { color: var(--text); }
  #info h2 { margin: 0 0 2px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  #info .swatch { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  #info .tag { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  #info table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #info td { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  #info td.k { color: var(--muted); width: 42%; }
  #info td.v { text-align: right; }
  #info .fact { margin-top: 14px; font-size: 12.5px; line-height: 1.55; color: #cdd6ea; }

  /* Planet labels */
  .label {
    font-family: inherit; appearance: none; -webkit-appearance: none;
    color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: .5px;
    padding: 4px 11px; border-radius: 10px;
    background: rgba(10,16,30,.88); border: 2px solid rgba(160,195,255,.7);
    box-shadow: 0 0 16px rgba(90,150,255,.55), 0 3px 12px rgba(0,0,0,.6);
    white-space: nowrap; transform: translateY(-3px);
    pointer-events: auto; cursor: pointer; text-shadow: 0 1px 4px rgba(0,0,0,.95); user-select: none;
  }
  .label.sun { color: #fff0c2; border-color: rgba(255,205,100,.85); box-shadow: 0 0 20px rgba(255,190,80,.65), 0 3px 12px rgba(0,0,0,.6); }

  /* Loading */
  #loader {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: #05070f; color: var(--muted); font-size: 14px; transition: opacity .6s;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .spin {
    width: 26px; height: 26px; margin-right: 12px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Mobile optimizations ---------- */
  @media (max-width: 768px) {
    #title { display: none; }                 /* free top space; full-screen scene */
    #controls {
      left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom));
      transform: none; width: auto; flex-wrap: wrap; justify-content: center;
      gap: 8px; padding: 9px 12px; border-radius: 14px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #controls button { padding: 10px 13px; font-size: 13px; min-height: 42px; }
    .ctl-group { font-size: 12px; gap: 6px; }
    .ctl-group input[type=range] { width: 96px; }
    .sep { display: none; }
    #info {
      left: 8px; right: 8px; top: 8px; bottom: auto;
      width: auto; max-height: 52vh; overflow-y: auto; padding: 14px 16px;
    }
    #info h2 { font-size: 19px; }
    #info .close { font-size: 22px; top: 9px; right: 12px; padding: 4px; }
    .label { font-size: 12px; padding: 3px 8px; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="title">
    <h1>Interactive Solar System</h1>
    <p>拖拽旋转视角 · 滚轮缩放 · 点击任意星球 / 矮行星查看资料并聚焦 · 右下控制台调速 / 显隐轨道与标签。<br>注：距离为示意比例，非真实天文尺度。</p>
  </div>

  <div id="info">
    <button class="close" aria-label="close">×</button>
    <h2><span class="swatch"></span><span class="name"></span></h2>
    <div class="tag"></div>
    <table></table>
    <div class="fact"></div>
  </div>

  <div id="controls">
    <button id="playBtn" class="active">⏸ Pause</button>
    <div class="sep"></div>
    <div class="ctl-group">
      <span>Speed</span>
      <input id="speed" type="range" min="0" max="5" step="0.1" value="1" />
      <span id="speedVal" style="width:30px;text-align:right;">1.0×</span>
    </div>
    <div class="sep"></div>
    <button id="orbitsBtn" class="active">Orbits</button>
    <button id="labelsBtn" class="active">Labels</button>
    <button id="resetBtn">Reset View</button>
  </div>

  <div id="loader"><div class="spin"></div>Loading three.js…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ---------- Data (display-scaled, not to physical scale) ----------
    const PLANETS = [
      { name:'Mercury', cn:'水星', color:0x9c8a7a, radius:1.8,  dist:24,  period:0.24,  spin:0.004, tilt:0.01, incl:0.12, moons:0,
        fact:'太阳系最小行星，昼夜温差极端（−180°C ~ 430°C）。', diameter:'4,879 km', orbit:'88 天', day:'1,408 小时', fromSun:'5,790 万 km' },
      { name:'Venus',   cn:'金星', color:0xd8b27a, radius:2.6,  dist:34,  period:0.62,  spin:-0.002, tilt:177.4, incl:0.06, moons:0,
        fact:'最热行星（约 465°C），浓密 CO₂ 大气与温室效应；逆向自转。', diameter:'12,104 km', orbit:'225 天', day:'5,832 小时', fromSun:'1.08 亿 km' },
      { name:'Earth',   cn:'地球', color:0x4a8fe0, radius:2.8,  dist:46,  period:1.0,   spin:0.02,  tilt:23.4, incl:0.0, moons:1, hasMoon:true,
        fact:'目前已知唯一承载生命的星球，71% 表面被液态水覆盖。', diameter:'12,742 km', orbit:'365.25 天', day:'24 小时', fromSun:'1.496 亿 km' },
      { name:'Mars',    cn:'火星', color:0xc1440e, radius:2.2,  dist:58,  period:1.88,  spin:0.018, tilt:25.2, incl:0.03, moons:2,
        fact:'红色星球，拥有太阳系最高火山奥林帕斯山（约 22 km）。', diameter:'6,779 km', orbit:'687 天', day:'24.6 小时', fromSun:'2.279 亿 km' },
      { name:'Jupiter', cn:'木星', color:0xd9a066, radius:7.0,  dist:88,  period:11.86, spin:0.04,  tilt:3.1,  incl:0.02, moons:95,
        fact:'最大行星（气态巨行星），大红斑是持续数百年的巨型风暴。', diameter:'139,820 km', orbit:'11.86 年', day:'9.9 小时', fromSun:'7.785 亿 km' },
      { name:'Saturn',  cn:'土星', color:0xe3c98b, radius:6.0,  dist:120, period:29.46, spin:0.038, tilt:26.7, incl:0.05, moons:146, ring:true,
        fact:'标志性的冰岩环系统，密度低于水，理论上可浮于水面。', diameter:'116,460 km', orbit:'29.5 年', day:'10.7 小时', fromSun:'14.34 亿 km' },
      { name:'Uranus',  cn:'天王星', color:0x9fe3e0, radius:4.4,  dist:148, period:84,   spin:0.03,  tilt:97.8, incl:0.05, moons:28, ring:true,
        fact:'冰巨星，自转轴几乎躺倒（98°），呈青蓝色（甲烷吸收）。', diameter:'50,724 km', orbit:'84 年', day:'17.2 小时', fromSun:'28.71 亿 km' },
      { name:'Neptune', cn:'海王星', color:0x3b62d6, radius:4.2,  dist:174, period:164.8, spin:0.032, tilt:28.3, incl:0.03, moons:16,
        fact:'最远行星，拥有太阳系最强风暴风（时速超 2,000 km）。', diameter:'49,244 km', orbit:'165 年', day:'16.1 小时', fromSun:'44.95 亿 km' },
    ];

    // ---------- Renderer / Scene / Camera ----------
    const isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent) || innerWidth < 768;
    const SEG = isMobile ? 28 : 48;   // sphere tessellation (lower on mobile for perf)
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setClearColor(0x05070f); // match body background so empty space blends

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);
    const DEFAULT_CAM = new THREE.Vector3(0, 95, 215);
    camera.position.copy(DEFAULT_CAM);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 12;
    controls.maxDistance = 1200;

    // ---------- Lighting ----------
    scene.add(new THREE.AmbientLight(0x8a98b8, 0.7));
    const sunLight = new THREE.PointLight(0xfff2d6, 3.2, 0, 0);
    scene.add(sunLight);

    // ---------- Starfield ----------
    (function makeStars(){
      const N = isMobile ? 3500 : 6000, pos = new Float32Array(N*3);
      for (let i=0;i<N;i++){
        const r = 900 + Math.random()*1600;
        const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
        pos[i*3]   = r*Math.sin(p)*Math.cos(t);
        pos[i*3+1] = r*Math.sin(p)*Math.sin(t);
        pos[i*3+2] = r*Math.cos(p);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos,3));
      const m = new THREE.PointsMaterial({ color:0xffffff, size:1.4, sizeAttenuation:false, transparent:true, opacity:0.85 });
      scene.add(new THREE.Points(g, m));
    })();

    // ---------- Sun ----------
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(10, isMobile ? 32 : 64, isMobile ? 32 : 64),
      new THREE.MeshBasicMaterial({ color:0xffd05a })
    );
    scene.add(sun);

    // sun glow sprite
    (function sunGlow(){
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const grd = ctx.createRadialGradient(128,128,0,128,128,128);
      grd.addColorStop(0,'rgba(255,220,130,0.9)');
      grd.addColorStop(0.25,'rgba(255,180,70,0.5)');
      grd.addColorStop(1,'rgba(255,140,40,0)');
      ctx.fillStyle = grd; ctx.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true }));
      spr.scale.set(40,40,1);
      sun.add(spr);
    })();

    // sun label
    addLabel(sun, 'Sun ☀', true, '#ffd05a');

    // ---------- Planets ----------
    const orbitRings = [];
    const planetObjs = [];
    const planetGroup = new THREE.Group();
    scene.add(planetGroup);

    function addLabel(parent, text, isSun, accent){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'label' + (isSun ? ' sun' : '');
      btn.textContent = text;
      btn.setAttribute('aria-label', text);
      if (accent) btn.style.borderLeft = `3px solid ${accent}`;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectObject(parent);              // tapping/activating the label = inspect + focus
      });
      const r = parent.geometry.parameters.radius;
      const obj = new CSS2DObject(btn);
      obj.position.set(0, r + 3, 0);
      parent.add(obj);
      return obj;
    }

    function makeRing(planet){
      const inner = planet.radius*1.4, outer = planet.radius*2.3;
      const g = new THREE.RingGeometry(inner, outer, 96);
      // simple banded texture
      const c = document.createElement('canvas'); c.width=1; c.height=64;
      const ctx = c.getContext('2d');
      for (let i=0;i<64;i++){
        const a = (i%8<4)?0.55:0.25;
        ctx.fillStyle = `rgba(220,210,180,${a})`;
        ctx.fillRect(0,i,1,1);
      }
      const tex = new THREE.CanvasTexture(c);
      const m = new THREE.MeshBasicMaterial({ map:tex, side:THREE.DoubleSide, transparent:true, opacity:0.8 });
      const ring = new THREE.Mesh(g, m);
      ring.rotation.x = -Math.PI/2; // flat in local plane; axial tilt applied on parent mesh
      return ring;
    }

    PLANETS.forEach(p => {
      const pivot = new THREE.Object3D();
      pivot.rotation.z = p.incl; // orbital inclination
      planetGroup.add(pivot);

      const mat = new THREE.MeshStandardMaterial({ color:p.color, roughness:0.8, metalness:0.05, emissive:p.color, emissiveIntensity:0.32 });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.radius, SEG, SEG), mat);
      mesh.position.x = p.dist;
      mesh.rotation.z = (p.tilt*Math.PI/180);
      pivot.add(mesh);

      if (p.ring){
        const ring = makeRing(p);
        mesh.add(ring);
      }

      // orbit ring (visible guide)
      const og = new THREE.RingGeometry(p.dist-0.06, p.dist+0.06, 160);
      const om = new THREE.MeshBasicMaterial({ color:0x4a5a7a, side:THREE.DoubleSide, transparent:true, opacity:0.4 });
      const orbit = new THREE.Mesh(og, om);
      orbit.rotation.x = -Math.PI/2;
      planetGroup.add(orbit);
      orbitRings.push(orbit);

      addLabel(mesh, p.name, false, '#' + new THREE.Color(p.color).getHexString());

      // Earth's moon
      let moonPivot = null, moonMesh = null;
      if (p.hasMoon){
        moonPivot = new THREE.Object3D();
        moonPivot.position.x = p.dist; // sit at the planet's position (set once)
        pivot.add(moonPivot);
        moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, isMobile?16:24, isMobile?16:24), new THREE.MeshStandardMaterial({color:0xbfbfbf, roughness:1}));
        moonMesh.position.x = p.radius + 3;
        moonPivot.add(moonMesh);
      }

      planetObjs.push({ data:p, pivot, mesh, angle:Math.random()*Math.PI*2, moonPivot, moonMesh });
    });

    // ---------- Dwarf planets (IAU / Wikipedia) ----------
    const DWARF = [
      { name:'Ceres',    cn:'谷神星', color:0x9b8b7a, radius:0.7, dist:70,  period:4.6,  spin:0.02,  tilt:0,    incl:0.03, moons:0,
        fact:'小行星带中唯一的矮行星，直径约 940 km，可能存在稀薄水汽大气。', diameter:'940 km',     orbit:'4.6 年',  day:'9 小时',    fromSun:'2.77 亿 km' },
      { name:'Pluto',    cn:'冥王星', color:0xc9b8a0, radius:0.9, dist:196, period:248,  spin:0.015, tilt:122,  incl:0.30, moons:5,
        fact:'经典矮行星，曾列为第九行星；表面有氮冰"心形"平原与稀薄大气。', diameter:'2,376 km',    orbit:'248 年',  day:'153 小时',  fromSun:'59 亿 km' },
      { name:'Haumea',   cn:'妊神星', color:0xddd6c8, radius:0.6, dist:202, period:284,  spin:0.06,  tilt:0,    incl:0.20, moons:2,
        fact:'椭球状矮行星，自转极快（约 4 小时），并拥有行星环。',           diameter:'~1,960 km',  orbit:'284 年',  day:'4 小时',    fromSun:'64 亿 km' },
      { name:'Makemake', cn:'鸟神星', color:0xb8a989, radius:0.6, dist:207, period:310,  spin:0.02,  tilt:0,    incl:0.16, moons:1,
        fact:'红色冰质矮行星，表面富含甲烷与乙烷冰。',                         diameter:'~1,430 km',  orbit:'310 年',  day:'~22 小时',  fromSun:'69 亿 km' },
      { name:'Eris',     cn:'阋神星', color:0xe8e8ee, radius:0.8, dist:214, period:559,  spin:0.02,  tilt:0,    incl:0.44, moons:1,
        fact:'质量与冥王星相当且略大，其发现促使冥王星被重新归类为矮行星。',   diameter:'2,326 km',    orbit:'559 年',  day:'25 小时',   fromSun:'101 亿 km' },
    ];
    const dwarfObjs = [];
    DWARF.forEach(p => {
      const pivot = new THREE.Object3D();
      pivot.rotation.z = p.incl;
      planetGroup.add(pivot);
      const mat = new THREE.MeshStandardMaterial({ color:p.color, roughness:0.9, metalness:0.0, emissive:p.color, emissiveIntensity:0.3 });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.radius, isMobile?20:32, isMobile?20:32), mat);
      mesh.position.x = p.dist;
      mesh.rotation.z = (p.tilt*Math.PI/180);
      pivot.add(mesh);
      const og = new THREE.RingGeometry(p.dist-0.05, p.dist+0.05, 160);
      const om = new THREE.MeshBasicMaterial({ color:0x4a5a7a, side:THREE.DoubleSide, transparent:true, opacity:0.25 });
      const orbit = new THREE.Mesh(og, om);
      orbit.rotation.x = -Math.PI/2;
      planetGroup.add(orbit);
      orbitRings.push(orbit);
      addLabel(mesh, p.name, false, '#' + new THREE.Color(p.color).getHexString());
      dwarfObjs.push({ data:p, pivot, mesh, angle:Math.random()*Math.PI*2 });
    });

    // ---------- Asteroid belt (between Mars and Jupiter) ----------
    const belt = new THREE.Group();
    (function makeBelt(){
      const N = 2400, pos = new Float32Array(N*3), col = new Float32Array(N*3);
      const c = new THREE.Color();
      for (let i=0;i<N;i++){
        const r = 64 + Math.random()*20;            // between Mars (58) and Jupiter (88)
        const a = Math.random()*Math.PI*2;
        const y = (Math.random()-0.5)*3.2;
        pos[i*3]   = r*Math.cos(a);
        pos[i*3+1] = y;
        pos[i*3+2] = r*Math.sin(a);
        c.setHSL(0.08, 0.12, 0.32 + Math.random()*0.22);
        col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos,3));
      g.setAttribute('color', new THREE.BufferAttribute(col,3));
      const m = new THREE.PointsMaterial({ size:0.55, sizeAttenuation:true, vertexColors:true, transparent:true, opacity:0.85 });
      belt.add(new THREE.Points(g, m));
    })();
    planetGroup.add(belt);

    // ---------- Info registry (sun + planets + dwarfs) ----------
    const bodyInfo = new Map();
    bodyInfo.set(sun, { name:'Sun', cn:'太阳', color:0xffd05a, diameter:'1,391,000 km', orbit:'—', day:'~600 小时', fromSun:'—', moons:'8 行星',
                        fact:'占太阳系总质量约 99.86%，为 G2V 型主序星；太阳系形成于约 46 亿年前。', tag:'恒星 · G2V' });
    planetObjs.forEach(o => bodyInfo.set(o.mesh, { ...o.data, tag:`${o.data.cn} · 行星` }));
    dwarfObjs.forEach(o => bodyInfo.set(o.mesh, { ...o.data, tag:`${o.data.cn} · 矮行星` }));

    // ---------- Post-processing (bloom) ----------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), isMobile ? 0.7 : 0.9, 0.5, 0.82);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ---------- Interaction ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let down = null;
    let focusTarget = null;     // mesh to follow
    let focusTransition = 0;    // 0..1 camera transition progress

    renderer.domElement.addEventListener('pointerdown', e => down = {x:e.clientX, y:e.clientY});
    renderer.domElement.addEventListener('pointercancel', () => down = null);
    renderer.domElement.addEventListener('pointerup', e => {
      if (!down) return;
      const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y);
      down = null;
      if (moved > (isMobile ? 10 : 6)) return; // was a drag, not a tap
      pointer.x = (e.clientX/innerWidth)*2 - 1;
      pointer.y = -(e.clientY/innerHeight)*2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const targets = [sun, ...planetObjs.map(o=>o.mesh), ...dwarfObjs.map(o=>o.mesh)];
      const hits = raycaster.intersectObjects(targets, false);
      if (hits.length) selectObject(hits[0].object);
    });

    const infoEl = document.getElementById('info');
    function selectObject(obj){
      const info = bodyInfo.get(obj);
      if (!info) return;
      showInfo(info, info.tag);
      focusTarget = obj; focusTransition = 0;
    }

    function showInfo(p, tag){
      infoEl.querySelector('.name').textContent = p.name;
      infoEl.querySelector('.tag').textContent = tag;
      const sw = infoEl.querySelector('.swatch');
      const col = '#' + new THREE.Color(p.color).getHexString();
      sw.style.background = col; sw.style.color = col;
      infoEl.querySelector('table').innerHTML = `
        <tr><td class="k">直径</td><td class="v">${p.diameter}</td></tr>
        <tr><td class="k">距太阳</td><td class="v">${p.fromSun}</td></tr>
        <tr><td class="k">公转周期</td><td class="v">${p.orbit}</td></tr>
        <tr><td class="k">自转周期</td><td class="v">${p.day}</td></tr>
        <tr><td class="k">卫星数</td><td class="v">${p.moons}</td></tr>`;
      infoEl.querySelector('.fact').textContent = p.fact;
      infoEl.classList.add('show');
    }
    infoEl.querySelector('.close').addEventListener('click', () => {
      infoEl.classList.remove('show'); focusTarget = null;
    });

    // ---------- UI controls ----------
    let playing = true, speed = 0.2, showOrbits = true, showLabels = !isMobile;
    const playBtn = document.getElementById('playBtn');
    const orbitsBtn = document.getElementById('orbitsBtn');
    const labelsBtn = document.getElementById('labelsBtn');
    if (!showLabels){ labelRenderer.domElement.style.display = 'none'; labelsBtn.classList.remove('active'); }
    const speedInput = document.getElementById('speed');
    const speedVal = document.getElementById('speedVal');
    playBtn.setAttribute('aria-pressed', String(playing));
    orbitsBtn.setAttribute('aria-pressed', String(showOrbits));
    labelsBtn.setAttribute('aria-pressed', String(showLabels));

    playBtn.onclick = () => {
      playing = !playing;
      playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
      playBtn.classList.toggle('active', playing);
      playBtn.setAttribute('aria-pressed', String(playing));
    };
    orbitsBtn.onclick = () => {
      showOrbits = !showOrbits;
      orbitRings.forEach(o => o.visible = showOrbits);
      orbitsBtn.classList.toggle('active', showOrbits);
      orbitsBtn.setAttribute('aria-pressed', String(showOrbits));
    };
    labelsBtn.onclick = () => {
      showLabels = !showLabels;
      labelRenderer.domElement.style.display = showLabels ? '' : 'none';
      labelsBtn.classList.toggle('active', showLabels);
      labelsBtn.setAttribute('aria-pressed', String(showLabels));
    };
    speedInput.oninput = () => {
      const v = parseFloat(speedInput.value);
      speed = v * 0.2;                       // 1.0× on the slider == old 0.2× pace
      speedVal.textContent = v.toFixed(1) + '×';
    };
    document.getElementById('resetBtn').onclick = () => {
      focusTarget = null; infoEl.classList.remove('show');
      controls.target.set(0,0,0);
      camera.position.copy(DEFAULT_CAM);
    };

    // ---------- Animation ----------
    const clock = new THREE.Clock();
    const tmp = new THREE.Vector3();
    const desired = new THREE.Vector3();

    function animate(){
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (playing){
        sun.rotation.y += 0.0015;
        planetObjs.forEach(o => {
          o.angle += dt * (0.5 / o.data.period) * speed * 0.3;
          o.pivot.rotation.y = o.angle;
          o.mesh.rotation.y += o.data.spin * speed;
          if (o.moonPivot){
            o.moonPivot.rotation.y += dt * 1.2 * speed;
          }
        });
        dwarfObjs.forEach(o => {
          o.angle += dt * (0.5 / o.data.period) * speed * 0.3;
          o.pivot.rotation.y = o.angle;
          o.mesh.rotation.y += o.data.spin * speed;
        });
        belt.rotation.y += dt * 0.02 * speed;
      }

      // camera focus follow (maintain offset even after the fly-in transition ends)
      if (focusTarget){
        focusTarget.getWorldPosition(tmp);
        if (focusTransition < 1){
          focusTransition = Math.min(1, focusTransition + dt*1.2);
          controls.target.lerp(tmp, 0.1);
        } else {
          controls.target.copy(tmp);
        }
        const r = focusTarget.geometry.parameters.radius;
        desired.set(0, r*3 + 8, r*3 + 18).add(tmp);
        camera.position.lerp(desired, 0.08);
      }

      controls.update();
      composer.render();
      labelRenderer.render(scene, camera);
    }
    animate();

    // ---------- Resize ----------
    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });

    // hide loader
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 350);
  </script>
  <script>
    // Standalone (non-module) fallback: if the module script above fails to load
    // three.js (e.g. CDN blocked or offline), surface a message instead of spinning forever.
    window.addEventListener('error', function () {
      var l = document.getElementById('loader');
      if (l) {
        l.classList.remove('hide');
        l.innerHTML = '<span style="color:#ff9b9b">加载 three.js 失败，请检查网络后刷新</span>';
      }
    }, true);
  </script>
</body>
</html>
